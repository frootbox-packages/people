# German texts of people and locations: labels of the blocks, texts for visitors and the screens (decision 0161).
"Team": "Team"
"The people of the team with photo, role and how to reach them, of all locations or of one. The people come from the backend.": "Die Menschen im Team mit Foto, Aufgabe und Kontakt, von allen Standorten oder von einem. Die Personen kommen aus dem Backend."
"Location": "Standort"
"Without a choice the people of all locations.": "Ohne Auswahl die Personen aller Standorte."
"Texts about the people": "Texte über die Personen"
"Heading": "Überschrift"
"Our team": "Unser Team"
"No people yet. Add them in the backend under \"People\" and publish them.": "Noch keine Personen. Leg sie im Backend unter „Personen“ an und veröffentliche sie."
"Contact person": "Ansprechperson"
"One person to contact, with photo, role, a few sentences and how to reach the person, e.g. beside a form. The person comes from the backend.": "Eine Person zum Ansprechen mit Foto, Aufgabe, ein paar Sätzen und Kontakt, z. B. neben einem Formular. Die Person kommt aus dem Backend."
"Person": "Person"
"Your contact": "Deine Ansprechperson"
"Choose a person in the settings of the block. Only published people can be chosen.": "Wähl eine Person in den Einstellungen des Blocks. Wählen kannst Du nur veröffentlichte Personen."
"One location with address, phone, email, opening hours and a map, e.g. on the contact page. The map loads only once the visitor agrees. The location comes from the backend.": "Ein Standort mit Adresse, Telefon, E-Mail, Öffnungszeiten und Karte, z. B. auf der Kontaktseite. Die Karte lädt erst, wenn Besucher zustimmen. Der Standort kommt aus dem Backend."
"Map": "Karte"
"Without a map": "Ohne Karte"
"Visit us": "Besuch uns"
"Opening hours": "Öffnungszeiten"
"Choose a location in the settings of the block. Only published locations can be chosen.": "Wähl einen Standort in den Einstellungen des Blocks. Wählen kannst Du nur veröffentlichte Standorte."
# Backend (decision 0226)
"People": "Personen"
"Locations": "Standorte"
"The team and contact persons. The blocks \"Team\" and \"Contact person\" show them on the website.": "Das Team und Ansprechpersonen. Die Blöcke „Team“ und „Ansprechperson“ zeigen sie auf der Website."
"New person": "Neue Person"
"New location": "Neuer Standort"
"No people yet": "Noch keine Personen"
"Add the first person. It stays a draft until you publish it.": "Leg die erste Person an. Sie bleibt ein Entwurf, bis Du sie veröffentlichst."
"No locations yet": "Noch keine Standorte"
"Add the first location. It stays a draft until you publish it.": "Leg den ersten Standort an. Er bleibt ein Entwurf, bis Du ihn veröffentlichst."
"Where the team works, with address, opening hours and a map. The block \"Location\" shows one on the website.": "Wo das Team arbeitet, mit Adresse, Öffnungszeiten und Karte. Der Block „Standort“ zeigt einen davon auf der Website."
"Without a name": "Ohne Namen"
"Given name": "Vorname"
"Family name": "Nachname"
"Before the name": "Vor dem Namen"
"A title such as \"Dr.\".": "Ein Titel wie „Dr.“."
"What the person does, e.g. \"Head roaster\".": "Was die Person macht, z. B. „Röstmeisterin“."
"Save as a draft": "Als Entwurf speichern"
"The person is saved as a draft.": "Die Person ist als Entwurf gespeichert."
"The location is saved as a draft.": "Der Standort ist als Entwurf gespeichert."
"As visitors know it, e.g. \"Café by the harbour\".": "So, wie Besucher ihn kennen, z. B. „Café am Hafen“."
"Street": "Straße"
"Postcode": "Postleitzahl"
"Town": "Ort"
"Country": "Land"
"Only for locations abroad.": "Nur für Standorte im Ausland."
"Coordinates": "Koordinaten"
"Latitude and longitude for the map, e.g. \"53.5444, 9.9663\". Right-click the place in a map to copy them.": "Breiten- und Längengrad für die Karte, z. B. „53.5444, 9.9663“. Ein Rechtsklick auf den Ort in einer Karte kopiert sie."
"Name and contact": "Name und Kontakt"
"Address and contact": "Adresse und Kontakt"
"Photo": "Foto"
"Order in the team": "Reihenfolge im Team"
"Smaller numbers come first, the same ones by family name.": "Kleinere Zahlen stehen vorn, gleiche nach Nachname."
"About the person": "Über die Person"
"A few sentences, shown with the contact person.": "Ein paar Sätze, die bei der Ansprechperson stehen."
"About the location": "Über den Standort"
"A few sentences, e.g. how to get there.": "Ein paar Sätze, z. B. wie man hinkommt."
"One line each, e.g. \"Mon to Fri 8:00 to 18:00\".": "Je eine Zeile, z. B. „Mo bis Fr 8 bis 18 Uhr“."
"Visitors in this language see the texts in the first language.": "Besucher in dieser Sprache sehen die Texte in der ersten Sprache."
"The person is published.": "Die Person ist veröffentlicht."
"The location is published.": "Der Standort ist veröffentlicht."
"Your changes to this person are lost. The published version stays.": "Deine Änderungen an dieser Person gehen verloren. Die veröffentlichte Fassung bleibt."
"The person was never published and is gone afterwards.": "Die Person war nie veröffentlicht und ist danach weg."
"Your changes to this location are lost. The published version stays.": "Deine Änderungen an diesem Standort gehen verloren. Die veröffentlichte Fassung bleibt."
"The location was never published and is gone afterwards.": "Der Standort war nie veröffentlicht und ist danach weg."
"Delete the person": "Person löschen"
"Delete the location": "Standort löschen"
"The person is deleted.": "Die Person ist gelöscht."
"The location is deleted.": "Der Standort ist gelöscht."
"Pages that show the person show nothing in its place.": "Seiten, die die Person zeigen, zeigen an ihrer Stelle nichts."
"Pages that show the location show nothing in its place. People keep their other locations.": "Seiten, die den Standort zeigen, zeigen an seiner Stelle nichts. Personen behalten ihre anderen Standorte."
"Email": "E-Mail"
"Phone": "Telefon"
